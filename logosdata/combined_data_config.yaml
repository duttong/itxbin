# Roadmap for the LOGOS combined data sets (logosdata/combined_data.py,
# combined_data_batch.py).
#
# A combined data set blends several measurement programs into one monthly
# record per background site, then into semi-hemispheric, hemispheric and
# global means.  It replaces the Igor Pro "HATS combined" calculation
# (HATS-Igor-code/CATS/Global Means.ipf: calcHATScombinedData ->
# Global_Mean), whose output is published as
# /aftp/hats/<gas dir>/combined/HATS_global_<igor name>.txt.
#
# Differences from the Igor version, by design:
#   * Hemispheric and global means use the GML_means semi-hemispheric bands
#     (see global_means.py and gml_global_means_config.yaml) instead of Igor's
#     cos(lat) weights divided by latitude-bin counts.
#   * Per-program scale offsets (Igor's root:offsets table) are applied only
#     where the programs clearly disagree (CFC113 ECDs, CFC12 RITS and M1),
#     estimated from their overlap by `combined_data_batch.py --offsets`.
#   * Gaps in each program/site series are filled with the Holt-Winters
#     seasonal fill used by the M* global-means export (max 12 months), not
#     Igor's Monte Carlo poly4+harmonics ensemble, and nothing is extrapolated
#     past a program's last month (Igor extended OTTO 6 months).
#   * IE3 joins the in-situ programs.
#
# Steps for each gas:
#   1. Load each program's per-site monthly mean, sd and n.
#   2. Turn sd into a standard error (se_divisor, se_cap, site_se_scale).
#   3. Fill interior gaps in each program/site series.
#   4. Combine the programs at each site, weighting by 1/se (Igor
#      WeightedMean_ofasite): mean = sum(x/se)/sum(1/se), sd = N/sum(1/se),
#      plus a mismatch term where programs disagree by more than their errors.
#   5. Smooth each site with a Savitzky-Golay filter.
#   6. Band, hemispheric and global means with cos(lat) weights.

# Background sites in the combined products (Igor AllBKsitesOTTO), plus the
# MLO PFP pseudo-site.
sites: [alt, sum, brw, mhd, thd, nwr, kum, mlo, mlo_pfp, smo, cgo, psa, spo]

# PFP pseudo-sites: flask pairs at the base site with no pair ID (pair_id_num
# = 0) are CCGG PFP samples and are kept apart under the pseudo-site name, at
# the base site's latitude.  PFPs replaced programmatic flasks at MLO after the
# Nov 2022 Mauna Loa eruption (no flask analyses 2023-2024) and have run
# alongside them in 2021-2022 and from 2025.  Only the M* instruments (M3/M4)
# measured them.  As in the M* global-means export, both are weighted while
# they run concurrently, so the MLO location counts twice in the LN band then
# (an open question -- see gml_global_means_config.yaml).
pfp_sites:
  mlo_pfp: mlo

# Semi-hemispheric bands and weighting latitudes, as in
# gml_global_means_config.yaml.
phi: 30.0
weight_lat_overrides:
  spo: -65.0

# Gap filling of each program/site monthly series before programs are combined.
# Igor filled every interior gap.  A 12-month cap recovers most of the Global
# months that a 3-month cap loses (mostly before 1990, when a gap at one
# southern oldGC site empties a band) with little change in agreement with the
# published files (2026-09-26: CFC11 Global mean |diff| 0.357 -> 0.372 ppt,
# N2O 0.090 -> 0.106 ppb).  Longer breaks stay unfilled: MLO's 33-month
# eruption outage (mlo_pfp covers it), fECD's ~2013-2019 N2O/SF6 break
# (CCGG covers it), CATS-SPO CFC12 2010-2024.  24 months would match Igor's
# coverage almost exactly.
interpolation_method: seasonal
max_interpolation_months: 12

# Savitzky-Golay smoothing of each site's combined series (Igor
# Station_smooth: Smooth/E=3/S=4 7).  Runs shorter than the window are left
# unsmoothed.  Set window to 0 to turn smoothing off.
smoothing:
  window: 7
  order: 4

# Measurement programs.  Order is the order of the bits in the 'programs'
# string stored with every row (1 = the program contributed that month).
#
# source types:
#   oldgc       hats.fecd_oldgc monthly means (loaded from the published /aftp
#               oldGC files by fecd_oldgc_import.py).
#   insitu      hats.ng_insitu_monthly_means for the listed inst_nums
#               (insitu_monthly_means_batch.py).
#   pairs       hats.ng_pair_avg_view flask pair means for the listed inst_ids,
#               aggregated to monthly mean/sd/n.  PFP pairs go to their
#               pseudo-site (pfp_sites).  OTTO rows get site and date from
#               hats.hatsflask_pair_info.
#   ccgg        ccgg.flask_data_view, CCGG surface flasks, unflagged
#               ('..%'); pair means per event time, then monthly mean/sd, with
#               sd = sqrt(sd^2 + mean(unc)^2) (as ~/CCGG/N2O_comparison.py).
#
# se_divisor turns the monthly sd into a standard error: a number, or
# 'sqrt_n' to divide by sqrt(n).  Igor's values: CATS 14, RITS 2, MSD 4,
# CCGG 2, oldGC 1.  Igor's OTTO files were already standard errors; the
# pair-mean sd here is not, hence sqrt_n.  A missing se (one-sample month)
# gets the median se of that program/site series.
programs:
  oldGC:
    source: oldgc
    se_divisor: 1
    # Igor smoothed each oldGC site record with Loess (SMTH 0.05 of its monthly
    # grid, ~30 months; 0.2, ~120 months, for the short ALT and CGO records)
    # and used the smooth curve for every month from first to last sample.
    # This replaces the gap fill for this program, and is what bridges SPO:
    # flasks there were sampled only 1-4 months a year before 1992, with
    # gaps of up to two years (1981-1983).
    loess:
      window_months: 30
      site_window_months: {alt: 120, cgo: 120}
  RITS:
    source: insitu
    inst_nums: [246, 247, 248, 249, 250]
    se_divisor: 2
  fECD:
    source: pairs
    inst_ids: [OTTO, FE3]
    se_divisor: sqrt_n
  CATS:
    source: insitu
    inst_nums: [239, 240, 241, 242, 243, 244]
    se_divisor: 14
  IE3:
    source: insitu
    inst_nums: [236]
    se_divisor: 14
  CCGG:
    source: ccgg
    se_divisor: 2
  MSD:
    source: pairs
    inst_ids: [M1, M3, M4]
    se_divisor: 4

# Igor doubled the standard error at SMO for every program.
site_se_scale:
  smo: 2.0

# The combined data sets.  Programs and their order come from Igor
# calcHATScombinedData, plus IE3 wherever CATS is used.
#   parameter_num  the pnum stored in ng_logos_combined_data
#   pnums          per-program parameter_num where it differs
#   gas_dir        /aftp/hats directory of the published combined file
#   file_gas       gas name in the published combined file name
#   se_cap         per-program cap on the standard error (Igor capped the
#                  OTTO N2O standard error at 0.7 ppb)
#   drop_if_only   site-months supported only by these programs are dropped,
#                  so the record ends where the flask data does (Igor
#                  Filter_ifCATSonlyProgram, used for the CFCs)
#   offsets_pct    per-program scale offset in percent, applied as
#                  mf * (100 + pct) / 100 (Igor ReturnOffset).  Either a
#                  number, or a list of {pct, start, end} (YYYY-MM-DD, either
#                  end open) for an offset that applies to part of the record.
#   program_limits per-program {start, end} dates; data outside is not used.
#
# Offsets.  `combined_data_batch.py --offsets [gas]` estimates every program's
# level from the site-months it shares with the others (measured months only,
# at least 12 shared site-months per pair), relative to offset_reference, and
# prints the pairwise differences, the drift left per 5-year block, and an
# offsets_pct block.
#   offset_reference       program held at zero
#   offset_reference_date  which piece of the reference, if it has breaks
#   offset_breaks          dates where a program is split and each piece gets
#                          its own offset: fECD at the OTTO -> FE3 changeover
#                          (2019-09), MSD at M1 -> M3 (2009-06)
# Only offsets that are large and stable across the record are applied, to
# avoid fitting noise (2026-09-26):
#   CFC113  CATS and OTTO +2.1% above MSD, steady 1995-2019 (CFC-113a
#           co-elution on the ECDs).
#   CFC12   RITS -1.3 to -1.7% and M1 -0.7 to -0.9% below OTTO; Igor applied
#           the same two (the published file sits there too).
# Estimated but not applied (under ~0.3%, or poorly constrained):
#   CFC11   all within 0.2% except oldGC ~+0.5-0.7%, tied only through 1991-95.
#   CFC12   FE3 and M3/M4 -0.37% vs OTTO (the published file keeps this
#           step at 2019); oldGC +0.3-0.7%, inconsistent pairs.
#   CCl4    FE3 -0.8% vs OTTO (a step the published file also keeps); CATS
#           +0.2% but provisional until the CATS recalcs.
#   N2O     fECD(OTTO) -0.17% vs CCGG; others under 0.1%.
#   SF6     OTTO -0.23% vs CCGG; others under 0.1%.
gases:
  CFC11:
    parameter_num: 114
    units: ppt
    gas_dir: cfcs/cfc11
    file_gas: F11
    programs: [CATS, IE3, RITS, fECD, oldGC, MSD]
    offset_reference: fECD
    offset_reference_date: '2005-01-01'
    offset_breaks: {fECD: ['2019-09-01'], MSD: ['2009-06-01']}
    drop_if_only: [CATS, IE3]
    pnums: {MSD: 29}
  CFC12:
    parameter_num: 22
    units: ppt
    gas_dir: cfcs/cfc12
    file_gas: F12
    programs: [CATS, IE3, RITS, fECD, oldGC, MSD]
    offset_reference: fECD
    offset_reference_date: '2005-01-01'
    offset_breaks: {fECD: ['2019-09-01'], MSD: ['2009-06-01']}
    offsets_pct:
      RITS: 1.70
      MSD: [{pct: 0.74, end: '2009-05-31'}]
    drop_if_only: [CATS, IE3]
  CFC113:
    parameter_num: 32
    units: ppt
    gas_dir: cfcs/cfc113
    file_gas: F113
    programs: [CATS, IE3, fECD, MSD]
    offset_reference: MSD
    offset_reference_date: '2015-01-01'
    offset_breaks: {fECD: ['2019-09-01'], MSD: ['2009-06-01']}
    offsets_pct:
      CATS: -2.11
      fECD: [{pct: -2.05, end: '2019-08-31'}]
    drop_if_only: [CATS, IE3]
    # CFC-113a co-elutes with CFC-113 on the ECDs and is growing in the
    # atmosphere, so the ECD programs drift high against MSD from about 2020.
    # Only MSD is used from 2021.
    program_limits:
      CATS: {end: '2020-12-31'}
      IE3: {end: '2020-12-31'}
      fECD: {end: '2020-12-31'}
  CCl4:
    parameter_num: 37
    units: ppt
    gas_dir: solvents/CCl4
    file_gas: CCl4
    programs: [CATS, IE3, RITS, fECD]
    offset_reference: fECD
    offset_reference_date: '2005-01-01'
    offset_breaks: {fECD: ['2019-09-01']}
  SF6:
    parameter_num: 6
    units: ppt
    gas_dir: sf6
    file_gas: SF6
    programs: [CATS, IE3, fECD, CCGG]
    offset_reference: CCGG
    offset_breaks: {fECD: ['2019-09-01']}
  N2O:
    parameter_num: 5
    units: ppb
    gas_dir: n2o
    file_gas: N2O
    programs: [CATS, IE3, RITS, oldGC, fECD, CCGG]
    offset_reference: CCGG
    offset_breaks: {fECD: ['2019-09-01']}
    se_cap: {fECD: 0.7}
